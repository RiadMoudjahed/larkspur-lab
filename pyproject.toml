[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "larkspur-lab"
dynamic = ["version"]
description = "A vulnerable AI agent lab: break a fictional shop's tool-calling agents, then see the code-level fixes."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Riad Moudjahed" }]
keywords = ["ai-security", "llm", "agents", "prompt-injection", "ctf", "security-training"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/RiadMoudjahed/larkspur-lab"
Issues = "https://github.com/RiadMoudjahed/larkspur-lab/issues"

[project.scripts]
larkspur = "larkspur.cli:main"

[tool.setuptools]
packages = ["larkspur"]

[tool.setuptools.dynamic]
version = { attr = "larkspur.__version__" }
